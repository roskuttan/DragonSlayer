[package]
name = "dragonslayer"
version = "0.1.0"
edition = "2024"
description = "Fan, battery and keyboard control for the MSI GF63 Thin 10UC: an open-source replacement for MSI Dragon Center"
license = "MIT"
repository = "https://github.com/roskuttan/DragonSlayer"
readme = "README.md"
# both exes are declared below (the CLI would otherwise take the package name)
autobins = false

# The app (window + tray). Its logic is tested in the library.
[[bin]]
name = "dragonslayer"
path = "src/bin/dragonslayer.rs"
test = false

# Command-line tool.
[[bin]]
name = "dragonslayer-cli"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.26.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
